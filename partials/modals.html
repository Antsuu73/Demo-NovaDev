<!-- Auth Modal -->
<div class="modal fade" id="authModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-0">
                <h5 class="modal-title" id="authModalTitle">Đăng nhập</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <button type="button" class="btn btn-google w-100 mb-4" id="btnGoogleLogin">
                    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.56 2.95-2.24 5.45-4.78 7.12l7.73 6c4.51-4.18 7.09-10.36 7.09-17.59z"/><path fill="#FBBC05" d="M10.53 28.59a14.5 14.5 0 0 1 0-9.18l-7.98-6.19a23.88 23.88 0 0 0 0 21.56l7.98-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                    Đăng nhập bằng Google
                </button>
                <div class="auth-divider mb-4"><span>hoặc</span></div>
                <ul class="nav nav-pills nav-fill mb-4" id="authTabs">
                    <li class="nav-item"><button class="nav-link active" data-tab="login">Đăng nhập</button></li>
                    <li class="nav-item"><button class="nav-link" data-tab="register">Đăng ký</button></li>
                </ul>
                <form id="loginForm">
                    <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" id="loginEmail" required></div>
                    <div class="mb-3"><label class="form-label">Mật khẩu</label><input type="password" class="form-control" id="loginPassword" required minlength="6"></div>
                    <button type="submit" class="btn btn-primary w-100">Đăng nhập</button>
                </form>
                <form id="registerForm" class="d-none">
                    <div class="mb-3"><label class="form-label">Tên hiển thị</label><input type="text" class="form-control" id="registerName" required></div>
                    <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" id="registerEmail" required></div>
                    <div class="mb-3"><label class="form-label">Mật khẩu</label><input type="password" class="form-control" id="registerPassword" required minlength="6"></div>
                    <button type="submit" class="btn btn-primary w-100">Đăng ký</button>
                </form>
                <div id="authError" class="alert alert-danger mt-3 d-none"></div>
            </div>
        </div>
    </div>
</div>

<!-- Create Post Modal -->
<div class="modal fade" id="createModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-0">
                <h5 class="modal-title" id="createModalTitle">Đăng bài viết mới</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="createForm">
                    <input type="hidden" id="postType" value="discussion">
                    <div class="mb-3"><label class="form-label">Tiêu đề</label><input type="text" class="form-control" id="postTitle" required maxlength="200"></div>
                    <div class="mb-3"><label class="form-label">Danh mục</label><select class="form-select" id="postCategory" required></select></div>
                    <div class="mb-3"><label class="form-label">Nội dung</label><textarea class="form-control" id="postContent" rows="8" required></textarea></div>
                    <button type="submit" class="btn btn-primary" id="createSubmitBtn">Đăng bài</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="toast" class="toast" role="alert">
        <div class="toast-body d-flex align-items-center gap-2">
            <span id="toastMsg"></span>
        </div>
    </div>
</div>
